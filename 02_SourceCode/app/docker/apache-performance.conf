# Hiệu năng phục vụ tĩnh và nén (qa_3, qa_4)
ServerName localhost
# "Header set" (không "always") chạy sau mod_expires nên thay hẳn Cache-Control, tránh trùng 2 header

# Tài nguyên Vite có băm nội dung trong tên tệp → cache dài hạn, không cần kiểm tra lại
<IfModule mod_expires.c>
    ExpiresActive On
</IfModule>
<LocationMatch "^/build/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
    <IfModule mod_expires.c>
        ExpiresDefault "access plus 1 year"
    </IfModule>
</LocationMatch>

# Ảnh/tệp người dùng trong /storage có thể bị thay → cache 1 ngày
<LocationMatch "^/storage/">
    Header set Cache-Control "public, max-age=86400"
    <IfModule mod_expires.c>
        ExpiresDefault "access plus 1 day"
    </IfModule>
</LocationMatch>

# Nén gzip cho văn bản (HTML Inertia chứa JSON trang, CSS, JS, SVG, GeoJSON)
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/calendar
    AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/geo+json application/ld+json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml font/ttf font/otf application/vnd.ms-fontobject
    # Proxy/CDN giữ bản nén và bản thô riêng
    Header append Vary Accept-Encoding env=!dont-vary
</IfModule>

# Prefork: giữ sẵn tiến trình để chịu đợt 100 người dùng đồng thời mà không phải fork liên tục
<IfModule mpm_prefork_module>
    StartServers             20
    MinSpareServers          20
    MaxSpareServers          50
    MaxRequestWorkers       150
    MaxConnectionsPerChild 5000
</IfModule>

KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 200
