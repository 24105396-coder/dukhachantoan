# Bảo mật cho tệp tĩnh Apache phục vụ trực tiếp (không qua middleware SecurityHeaders của Laravel)

# /storage: tệp do người dùng/seeder tạo. Không bao giờ cho chạy hay hiển thị như tài liệu có script.
# SVG minh họa do seeder sinh vẫn được phục vụ, nhưng trong sandbox CSP (không script, chỉ style inline).
<LocationMatch "^/storage/">
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
    Header always set Cross-Origin-Resource-Policy "same-origin"
</LocationMatch>
<LocationMatch "(?i)^/storage/.*\.(php[0-9]?|phtml|phar|html?|xhtml|shtml|js|mjs|xml|xsl)$">
    Require all denied
</LocationMatch>

# /build: tài nguyên Vite (JS/CSS/font) – chặn trình duyệt đoán kiểu, không cho mở như tài liệu
<LocationMatch "^/build/">
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'none'; sandbox"
</LocationMatch>

# Không cho PHP chạy trong thư mục tệp tải lên kể cả khi bị lách qua đường dẫn khác
<Directory "/var/www/html/storage/app/public">
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
    Options -Indexes -ExecCGI
    AllowOverride None
</Directory>
